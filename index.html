<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oceanwide Christmas Party 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@600&family=Pinyon+Script&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 80% 60% at 50% 35%,#23398A 0%,#142257 55%,#0B1536 100%) fixed;color:#F4ECDC;font:17px/1.5 'Cormorant Garamond',Georgia,serif;text-align:center}
h1{font:400 clamp(52px,10vw,88px)/1.05 'Pinyon Script',cursive;margin:0;color:#F0D58C}
p.k{font:500 13px Cinzel,serif;letter-spacing:.3em;color:#D9B460;margin:0 0 6px}
.links{display:grid;gap:14px;margin-top:30px;width:min(420px,90vw)}
a{display:block;padding:18px 20px;border:1.5px solid #D9B460;border-radius:14px;color:#F0D58C;text-decoration:none;font:600 15px Cinzel,serif;letter-spacing:.12em;background:rgba(10,18,50,.4)}
a:hover,a:focus-visible{background:#D9B460;color:#14204A;outline:none}
small{display:block;margin-top:4px;font:500 15px 'Cormorant Garamond',serif;letter-spacing:0;color:#C9D0E6}
a:hover small,a:focus-visible small{color:#14204A}
</style>
</head>
<body>
<main>
<p class="k">OCEANWIDE GROUP · DECEMBER 14, 2026</p>
<h1>A Christmas Masquerade</h1>
<nav class="links" aria-label="Event pages">
<a href="raffle/">THE GRAND RAFFLE<small>Roulette draw for the raffle rounds</small></a>
<a href="judging/">JUDGES' SCORESHEET<small>Score the group performances</small></a>
</nav>
</main>
</body>
</html>
